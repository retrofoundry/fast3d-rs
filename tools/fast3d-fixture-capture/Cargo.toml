[package]
name = "fast3d-fixture-capture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
asm = ["dep:fast3d", "fast3d/asm"]

[[bin]]
name = "fast3d-fixture-capture"
path = "src/main.rs"
required-features = ["asm"]

[dependencies]
fast3d = { path = "../../fast3d", optional = true }
fast3d-fixtures = { path = "../fast3d-fixtures" }
serde.workspace = true
sha2.workspace = true
toml.workspace = true
