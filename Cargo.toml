[workspace]
resolver = "2"
members = [
    "fast3d",
    "n64-gbi",
    "tools/fast3d-fixture-capture",
    "tools/fast3d-fixtures",
]

[workspace.package]
edition = "2021"
rust-version = "1.92"
version = "1.0.0"
authors = ["fast3d-rs developers"]
description = "Accurate N64 HLE + wgpu renderer"
homepage = "https://crates.io/crates/fast3d"
repository = "https://github.com/retrofoundry/fast3d-rs"
keywords = ["n64", "gbi", "graphics", "rendering", "fast3d"]
readme = "README.md"
license = "MIT"

[workspace.dependencies]
n64-gbi = { path = "n64-gbi", version = "0.1.0" }
wgpu = "29.0"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
