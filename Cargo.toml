[workspace]
resolver = "2"
members = ["ultragfx", "n64-gbi"]

[workspace.package]
edition = "2021"
version = "1.0.0"
authors = ["ultragfx developers"]
description = "Accurate N64 HLE + wgpu renderer"
homepage = "https://crates.io/crates/ultragfx"
repository = "https://github.com/retrofoundry/ultragfx"
keywords = ["n64", "gbi", "graphics", "rendering", "ultragfx"]
readme = "README.md"
license = "MIT"

[workspace.dependencies]
n64-gbi = { path = "n64-gbi" }
wgpu = "29.0"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
