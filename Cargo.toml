[workspace]
resolver = "2"
members = ["fast3d", "web"]

[workspace.package]
edition = "2021"
version = "1.0.0"
authors = ["fast3d-rs developers"]
description = "Accurate N64 F3DEX2 HLE + wgpu renderer"
homepage = "https://crates.io/crates/fast3d"
repository = "https://github.com/retrofoundry/fast3d-rs"
keywords = ["n64", "gbi", "graphics", "rendering", "fast3d"]
readme = "README.md"
license = "MIT"

[workspace.dependencies]
wgpu = "29.0"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
# wasm-bindgen MUST equal the Nix wasm-bindgen-cli version EXACTLY (0.2.108).
# The trio below is the lockstep-consistent set for wasm-bindgen 0.2.108 (matches wgpu 29.0.3).
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = "=0.3.85"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
