[package]
name = "fast3d"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true

[dependencies]
n64-gbi.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
log.workspace = true
futures-channel = { version = "0.3", optional = true }
egui = { version = "0.35", optional = true }
egui-wgpu = { version = "0.35", optional = true }

[dev-dependencies]
wgpu = { version = "29.0", features = ["wgsl"] }
env_logger = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"

# FXC takes tens of minutes on the tile-sampling shader and then crashes under WARP; the tests
# select DXC through WGPU_DX12_COMPILER=staticdxc.
[target.'cfg(windows)'.dev-dependencies]
wgpu = { version = "29.0", features = ["static-dxc"] }

[features]
default = []
asm = []
capture = ["dep:futures-channel"]
debug-ui = ["dep:egui", "dep:egui-wgpu"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
png = "0.18"

[[example]]
name = "replay_capture"
required-features = ["capture"]

[[example]]
name = "export_capture_rdram"
required-features = ["capture"]
