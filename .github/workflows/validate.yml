name: dx12-debug
on:
  pull_request:
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-latest
    env:
      RUST_TEST_THREADS: 1
      RUST_BACKTRACE: 1
      WGPU_DX12_COMPILER: staticdxc
      WGPU_BACKEND: dx12
      RUST_LOG: wgpu_core=warn,wgpu_hal=warn
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: lib
        shell: bash
        run: |
          cargo test -p fast3d --lib --no-fail-fast -- tests::goldens:: tests::tmem_witnesses:: render::texture_decode::gpu_tests:: 2>&1 | grep -E 'test result|FAILED|panicked'
      - name: integration
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test -p fast3d --all-features --no-fail-fast --test tmem_fixture_replay --test texture_decode_gpu --test texture_residency --test texture_residency_pressure --test rt64_v5 2>&1 | grep -E 'test result|FAILED|panicked'
