name: validate
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Compile-only checks (fmt + clippy). No GPU adapter needed, so these run on Linux.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: clippy (--features debug-ui)
        run: cargo clippy -p fast3d --features debug-ui --all-targets -- -D warnings
      - name: fixture integrity and literal drift
        run: cargo run -p fast3d-fixtures -- verify
      - name: fixture compiler parity
        run: cargo run -p fast3d-fixture-capture --features asm -- verify

  # Keep the published workspace rust-version honest, including optional dependencies and tests.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust 1.92.0
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: check MSRV (--all-features, --all-targets)
        run: cargo +1.92.0 check --workspace --all-features --all-targets --locked

  # Exercise the workspace release gate, then inspect and test the exact archives it produced.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package and validate published crates
        shell: bash
        run: |
          set -euo pipefail
          # `cargo package --workspace` includes `publish = false` members, unlike the release
          # operation. Exclude exactly the two private tools so this packages the publishable
          # workspace set that `cargo publish --workspace` selects.
          cargo package --workspace \
            --exclude fast3d-fixtures \
            --exclude fast3d-fixture-capture \
            --locked

          shopt -s nullglob
          fast3d_archives=(target/package/fast3d-*.crate)
          n64_gbi_archives=(target/package/n64-gbi-*.crate)
          if (( ${#fast3d_archives[@]} != 1 )); then
            echo "::error::expected one fast3d archive, found ${#fast3d_archives[@]}"
            exit 1
          fi
          if (( ${#n64_gbi_archives[@]} != 1 )); then
            echo "::error::expected one n64-gbi archive, found ${#n64_gbi_archives[@]}"
            exit 1
          fi

          bash .github/scripts/validate-fast3d-package.sh "${fast3d_archives[0]}"

          extract_root="$(mktemp -d)"
          tar -xzf "${fast3d_archives[0]}" -C "$extract_root"
          tar -xzf "${n64_gbi_archives[0]}" -C "$extract_root"
          extracted_fast3d=("$extract_root"/fast3d-*)
          extracted_n64_gbi=("$extract_root"/n64-gbi-*)
          if (( ${#extracted_fast3d[@]} != 1 || ${#extracted_n64_gbi[@]} != 1 )); then
            echo "::error::expected one extracted directory for each published crate"
            exit 1
          fi

          cargo test \
            --manifest-path "${extracted_fast3d[0]}/Cargo.toml" \
            --no-run \
            --config "patch.crates-io.n64-gbi.path='${extracted_n64_gbi[0]}'"

  # The GPU/render tests (goldens, framebuffer store, hooks, debugger) need a real wgpu
  # adapter. macOS runners have Metal and Windows runners have WARP (software D3D); Linux
  # runners have no adapter, so the render suite is not exercised there (it is compiled by
  # `lint`). Web/WebGPU behaviour is verified in-browser by the consumer app.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: test (default)
        run: cargo test --workspace
      - name: test (--features debug-ui)
        run: cargo test -p fast3d --features debug-ui
      - name: test (--all-features)
        run: cargo test --workspace --all-features
      - name: test ignored (--all-features)
        run: cargo test --workspace --all-features -- --ignored

  # Prove the library stays wasm-compatible (catches a native-only API / dep regression).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build for wasm32
        run: cargo build -p fast3d --target wasm32-unknown-unknown
